<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хранители состояний — авторский мерч Даниэлы Шандлоренко</title>
  <meta name="description" content="Хранители состояний — авторский мерч Даниэлы Шандлоренко: значки, чашки, блокноты, еженедельники, метафорические карты, дневник самопрограммирования, наклейки, шопперы и подарочные наборы.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6eee8;
      --paper:#fffaf6;
      --card:#fffdfb;
      --ink:#3a2417;
      --muted:#7b6457;
      --line:rgba(58,36,23,.12);
      --accent:#b86632;
      --accent-dark:#8a4923;
      --sand:#f2e5d9;
      --warm:#f8efe7;
      --gradient:linear-gradient(135deg,#6f3e22 0%, #9b572b 42%, #c9793d 74%, #e2a46f 100%);
      --shadow:0 20px 60px rgba(58,36,23,.08);
      --radius-xl:34px;
      --radius-lg:24px;
      --radius-md:18px;
      --container:min(1180px, calc(100% - 32px));
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(201,121,61,.08), transparent 28%),
        radial-gradient(circle at top right, rgba(111,62,34,.06), transparent 26%),
        var(--bg);
      color:var(--ink);
      line-height:1.6;
    }

    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}
    .container{width:var(--container);margin:0 auto}

    .header{
      position:sticky;
      top:0;
      z-index:30;
      backdrop-filter:blur(12px);
      background:rgba(255,250,246,.88);
      border-bottom:1px solid var(--line);
    }

    .header-inner{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
      padding:10px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .brand-mark{
      width:46px;
      height:46px;
      border-radius:16px;
      background:var(--gradient);
      color:#fffaf6;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:15px;
      flex:0 0 auto;
      box-shadow:var(--shadow);
    }

    .brand-text strong{
      display:block;
      font-size:16px;
      line-height:1.15;
    }

    .brand-text span{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-top:3px;
    }

    .nav{
      display:flex;
      align-items:center;
      gap:18px;
      color:var(--muted);
      font-size:14px;
      flex-wrap:wrap;
    }

    .nav a:hover{color:var(--ink)}

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:none;
      border-radius:999px;
      padding:15px 22px;
      font-weight:700;
      transition:.2s ease;
      cursor:pointer;
    }

    .button:hover{transform:translateY(-2px)}

    .button.primary{
      background:var(--gradient);
      color:#fffaf6;
      box-shadow:0 14px 30px rgba(111,62,34,.18);
    }

    .button.secondary{
      background:var(--paper);
      color:var(--ink);
      border:1px solid var(--line);
    }

    .button.ghost{
      background:transparent;
      color:var(--ink);
      border:1px solid var(--line);
    }

    .hero{
      padding:42px 0 24px;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:0.95fr 1.05fr;
      gap:24px;
      align-items:stretch;
    }

    .hero-photo,
    .hero-content,
    .section-card,
    .product-card,
    .cta-card{
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      background:rgba(255,253,251,.9);
    }

    .hero-photo{
      overflow:hidden;
      min-height:640px;
      background:#e7d5c7;
    }

    .hero-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 20%;
    }

    .hero-content{
      padding:36px;
      background:
        radial-gradient(circle at top right, rgba(201,121,61,.10), transparent 26%),
        rgba(255,253,251,.92);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:18px;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
      color:var(--accent-dark);
    }

    .eyebrow::before{
      content:"";
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--gradient);
      flex:0 0 auto;
    }

    h1,h2,h3{
      margin:0;
      line-height:1.08;
      letter-spacing:-.03em;
    }

    h1{
      font-size:clamp(38px, 5vw, 66px);
      margin-bottom:14px;
      font-weight:900;
    }

    h2{
      font-size:clamp(28px, 4vw, 46px);
      font-weight:900;
    }

    h3{
      font-size:24px;
      font-weight:900;
    }

    h1 em,h2 em{
      font-style:normal;
      color:var(--accent);
    }

    .hero-subtitle{
      font-size:19px;
      font-weight:700;
      color:var(--ink);
      margin-bottom:18px;
    }

    .hero-lead{
      font-size:18px;
      color:var(--muted);
      max-width:680px;
      margin:0;
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-top:28px;
    }

    .hero-tags{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:22px;
    }

    .hero-tag{
      padding:10px 14px;
      border-radius:999px;
      background:var(--sand);
      border:1px solid rgba(184,102,50,.14);
      font-size:14px;
      font-weight:700;
      color:var(--ink);
    }

    .section{
      padding:24px 0;
    }

    .section-card{
      padding:34px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      gap:24px;
      align-items:end;
      margin-bottom:26px;
    }

    .section-head p{
      margin:0;
      max-width:560px;
      color:var(--muted);
      font-size:16px;
    }

    .about-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .about-item{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:24px;
    }

    .about-item strong{
      display:block;
      font-size:16px;
      margin-bottom:8px;
    }

    .about-item p{
      margin:0;
      color:var(--muted);
      font-size:15px;
    }

    .availability-note{
      margin-bottom:22px;
      padding:18px 20px;
      background:var(--warm);
      border:1px solid rgba(58,36,23,.08);
      border-radius:20px;
      color:var(--ink);
      font-size:15px;
    }

    .availability-note strong{
      color:var(--accent-dark);
    }

    .products-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:18px;
    }

    .product-card{
      padding:22px;
      display:flex;
      flex-direction:column;
      min-height:100%;
    }

    .product-media{
      position:relative;
      overflow:hidden;
      border-radius:24px;
      background:var(--warm);
      aspect-ratio:4 / 3;
      border:1px solid rgba(58,36,23,.08);
      margin-bottom:18px;
    }

    .product-media img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
    }

    .price{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:max-content;
      padding:8px 14px;
      border-radius:999px;
      background:var(--sand);
      border:1px solid rgba(184,102,50,.14);
      font-weight:800;
      color:var(--accent-dark);
      margin:14px 0 12px;
    }

    .product-card p{
      margin:0;
      color:var(--muted);
      font-size:15px;
    }

    .product-card ul{
      margin:10px 0 0;
      padding-left:18px;
      color:var(--muted);
      font-size:15px;
    }

    .carousel{
      position:relative;
      width:100%;
      height:100%;
    }

    .carousel-slide{
      position:absolute;
      inset:0;
      opacity:0;
      transition:opacity .35s ease;
      pointer-events:none;
    }

    .carousel-slide.active{
      opacity:1;
      pointer-events:auto;
    }

    .carousel-btn{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:rgba(255,250,246,.92);
      color:var(--ink);
      box-shadow:0 6px 20px rgba(58,36,23,.12);
      cursor:pointer;
      z-index:2;
      display:grid;
      place-items:center;
      font-size:18px;
      transition:.2s ease;
    }

    .carousel-btn:hover{transform:translateY(-50%) scale(1.04)}
    .carousel-btn.prev{left:12px}
    .carousel-btn.next{right:12px}

    .carousel-dots{
      position:absolute;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      display:flex;
      gap:8px;
      z-index:2;
    }

    .carousel-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      border:none;
      background:rgba(255,250,246,.75);
      cursor:pointer;
      padding:0;
    }

    .carousel-dot.active{
      background:var(--accent-dark);
    }

    .cta-card{
      padding:34px;
      background:
        radial-gradient(circle at top left, rgba(201,121,61,.12), transparent 28%),
        rgba(255,253,251,.94);
    }

    .cta-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:24px;
    }

    .cta-row p{
      margin:12px 0 0;
      color:var(--muted);
      max-width:720px;
    }

    .contacts-line{
      margin-top:18px;
      color:var(--muted);
      font-size:15px;
    }

    .contacts-line strong{
      color:var(--ink);
    }

    .footer{
      padding:28px 0 50px;
      color:var(--muted);
      font-size:14px;
    }

    .footer-inner{
      display:flex;
      justify-content:space-between;
      gap:18px;
      border-top:1px solid var(--line);
      padding-top:18px;
    }

    @media (max-width: 980px){
      .hero-grid,
      .products-grid,
      .cta-row,
      .about-grid{
        grid-template-columns:1fr;
        display:grid;
      }

      .hero-photo{
        min-height:420px;
      }

      .section-head{
        display:block;
      }

      .section-head p{
        margin-top:12px;
      }
    }

    @media (max-width: 700px){
      .header-inner{
        min-height:auto;
        align-items:flex-start;
      }

      .nav{
        width:100%;
        order:3;
        font-size:13px;
      }

      .hero{
        padding:24px 0 16px;
      }

      .hero-content,
      .section-card,
      .product-card,
      .cta-card{
        padding:22px;
        border-radius:24px;
      }

      .hero-photo{
        min-height:320px;
        border-radius:24px;
      }

      .hero-actions,
      .cta-row .hero-actions{
        flex-direction:column;
      }

      .button{
        width:100%;
      }

      .footer-inner{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>

    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="На главную">
        <div class="brand-mark">DS</div>
        <div class="brand-text">
          <strong>Даниэла Шандлоренко</strong>
          <span>психолог, арт-терапевт, преподаватель психологии</span>
        </div>
